<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Cámara Pro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: white;
      padding: 40px;
      max-width: 420px;
      width: 90%;
      border-radius: 12px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
      text-align: center;
    }

    h1 {
      margin-top: 0;
      color: #1e3c72;
    }

    p {
      color: #555;
      line-height: 1.6;
    }

    .footer {
      margin-top: 30px;
      font-size: 14px;
      color: #999;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>CamaraPro</h1>
    <p>
      Bienvenidos a nuestro sitio web.<br>
      Ofrecemos soluciones profesionales en nuestro sector.
    </p>

    <p>
      Estamos trabajando para brindarte más información muy pronto.
    </p>

    <div class="footer">
      © 2026 CamaraPro
    </div>
  </div>
</body>
</html>
