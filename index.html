<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>CamaraPro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    :root {
      /* 🎨 Colores corporativos */
      --color-principal: #0f172a;
      --color-secundario: #2563eb;
      --color-fondo: #f1f5f9;
      --color-texto: #334155;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--color-fondo);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: white;
      padding: 40px;
      max-width: 460px;
      width: 90%;
      border-radius: 14px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.15);
      text-align: center;
    }

    .logo {
      font-size: 28px;
      font-weight: bold;
      color: var(--color-secundario);
      margin-bottom: 10px;
    }

    h1 {
      margin-top: 10px;
      color: var(--color-principal);
    }

    p {
      color: var(--color-texto);
      line-height: 1.6;
    }

    .footer {
      margin-top: 30px;
      font-size: 14px;
      color: #94a3b8;
    }
  </style>
</head>

<body>
  <div class="card">

    <!-- 🖼️ Logo -->
    <div class="logo">CamaraPro</div>

    <h1>Bienvenidos</h1>

    <p>
      Somos una empresa enfocada en brindar soluciones profesionales
      con calidad y confianza.
    </p>

    <p>
      Pronto encontrarás más información sobre nuestros servicios.
    </p>

    <div class="footer">
      © 2026 CamaraPro
    </div>
  </div>
</body>
</html>
